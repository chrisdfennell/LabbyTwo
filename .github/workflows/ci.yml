name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # So the release workflow can run exactly these checks rather than a copy of them that
  # drifts. A release that skipped a test the branch runs would be the worst kind.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore

      # Warnings are kept at zero, so a new one should fail the build rather than pile up.
      - run: dotnet build --no-restore --configuration Release -warnaserror

      - run: dotnet test --no-build --configuration Release --verbosity normal

      # The example plugins are not part of the app's build, so nothing else would notice
      # if a change to an interface broke them — and a broken example is worse than none.
      - name: Build the example plugins
        run: |
          for plugin in examples/*/; do
            echo "::group::$plugin"
            dotnet build "$plugin" --configuration Release -warnaserror
            echo "::endgroup::"
          done

      # For the WebSocket client built into Node 22, which the smoke test uses to drive
      # the runner's Chrome. The runner's own Node is older and has no such thing.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Everything above passed for v1.6.2, which then never started for anyone who had
      # the status page plugin installed: a deadlock in the container, with no error and
      # no log line after "Scanning plugins". Building the plugins proves they compile, not
      # that the app runs with them. So this starts the published app with every one of
      # them loaded, fills in a dashboard, and requires it to answer, draw its cards in a
      # real browser and keep probing — each step with a deadline, and a stack dump of
      # every thread if one passes. The release runs this workflow, so a release that
      # would not start is never tagged.
      #
      # The step's own timeout is only a backstop. The script's deadlines are what should
      # fire, because they are the ones that print why.
      - name: Start the app with every plugin loaded
        timeout-minutes: 10
        run: bash scripts/smoke-boot.sh
