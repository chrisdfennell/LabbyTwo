name: Build and push Docker images

on:
  push:
    branches: [main]
    # A release is only a release once there is an image for it — install.sh builds from
    # source, but the pull-an-image and Watchtower paths need one published under the tag.
    tags: ['v*']
  # Pull requests build but never publish, which gives dependency updates a compile check.
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest

    # A step's `if:` cannot read the secrets context, so mirror the one we test into env.
    # This is what lets a fork, or a clone nobody has configured a registry for, still get
    # the build as a compile check instead of a red X on a login it was never going to do.
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - uses: actions/checkout@v4
        with:
          # git describe below needs the tags, and the default shallow clone has none —
          # so without this a tagged release would still be stamped as a bare commit sha,
          # both in the image tag and in the version Settings shows.
          fetch-depth: 0

      # arm64 matters here: a good share of home labs run on a Raspberry Pi or an ARM NAS.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Say whether this run will publish
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "Registry credentials found — this run will push." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No DOCKERHUB_USERNAME secret set, so this run builds but does not push." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in the repository's Actions" \
              "secrets to publish images." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: docker/login-action@v3
        if: env.DOCKERHUB_USERNAME != '' && github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        run: |
          # Forks, PRs and unconfigured clones have no secret, so fall back to a
          # placeholder — buildx rejects a tag beginning with "/" even when nothing is
          # being pushed.
          echo "image=${DOCKERHUB_USERNAME:-local}/labbytwo" >> "$GITHUB_OUTPUT"

          # On a tag, the version is that tag exactly — which is what Settings compares
          # against the newest release. On main it is a describe, so it carries both the
          # release it is counting from and the commit, and reads as ahead rather than as
          # a release it is not.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="$(git describe --tags --always --long)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # :latest should mean the newest *release*, not the newest commit — otherwise
          # everyone pulling it, Watchtower included, is silently tracking main.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "moving=latest" >> "$GITHUB_OUTPUT"
          else
            echo "moving=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.DOCKERHUB_USERNAME != '' && github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            LABBYTWO_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.moving }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
