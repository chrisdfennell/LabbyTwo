name: Build and push Docker images

on:
  push:
    branches: [main]
  # Pull requests build but never publish, which gives dependency updates a compile check.
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # arm64 matters here: a good share of home labs run on a Raspberry Pi or an ARM NAS.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        run: |
          owner="${{ secrets.DOCKERHUB_USERNAME }}"
          # Forks and PRs get no secrets, so fall back to a placeholder — buildx rejects a
          # tag beginning with "/" even when nothing is being pushed.
          echo "image=${owner:-local}/labbytwo" >> "$GITHUB_OUTPUT"
          echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            LABBYTWO_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
