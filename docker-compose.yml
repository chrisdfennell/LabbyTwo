# LabbyTwo holds no configuration of its own — everything you connect and every tab you
# build is stored in the mounted volume. That is why this file is nine lines and has no
# per-integration environment variables to keep in sync.
services:
  labbytwo:
    build:
      context: .
      args:
        # The commit this image was built from, so the app can tell whether it is behind.
        # install.sh sets it; a bare "docker compose build" leaves it as "dev".
        LABBYTWO_VERSION: ${LABBYTWO_VERSION:-dev}
    # Or skip the build and pull a published image instead:
    # image: yourname/labbytwo:latest
    # No container_name on purpose. A fixed one is global to the Docker host, so a second
    # install in another directory would collide with the first — and Compose would adopt
    # and restart the running one rather than refuse. Compose names it after the project
    # (the directory) instead, which stays unique. Use "docker compose logs", not
    # "docker logs labbytwo".
    restart: unless-stopped
    ports:
      # Change the left-hand side, or set LABBY_PORT in .env, if 5150 is taken.
      - "${LABBY_PORT:-5150}:8080"
    environment:
      # Without this the container runs on UTC and every displayed time is wrong.
      TZ: ${TZ:-UTC}
      # Setting a password turns the login screen on. Empty leaves LabbyTwo open, which
      # is fine on a trusted LAN and not fine anywhere else.
      Labby__Auth__Username: ${LABBY_AUTH_USERNAME:-labby}
      Labby__Auth__Password: ${LABBY_AUTH_PASSWORD:-}
      # Reverse proxies allowed to say who the client really is, as addresses or CIDR
      # ranges separated by commas. Wrong passwords are slowed per client address, so this
      # matters once a login is set: empty ignores X-Forwarded-For from everyone, and every
      # visitor through a proxy or Cloudflare Tunnel then shares the proxy's address — one
      # person guessing locks everyone out. Name only the proxy itself (the cloudflared
      # container's address, or its Docker network's range): anything listed here can
      # pick the address its requests are counted against.
      Labby__Proxy__TrustedProxies: ${LABBY_TRUSTED_PROXIES:-}
      # Which header holds the client address. CF-Connecting-IP behind Cloudflare, which
      # Cloudflare sets itself; X-Forwarded-For for Caddy, nginx, Traefik and the rest.
      Labby__Proxy__ClientIpHeader: ${LABBY_CLIENT_IP_HEADER:-X-Forwarded-For}
      # Seconds between probes of every connection.
      Labby__ProbeSeconds: ${LABBY_PROBE_SECONDS:-30}
      # Consecutive failures before a service is called down. Raise it for something that
      # blips — a NAS admin UI goes unresponsive under load without actually being down.
      Labby__FailuresBeforeDown: ${LABBY_FAILURES_BEFORE_DOWN:-2}
      # Days of full-resolution metric history — every reading — to keep. Older readings
      # are folded into hourly summaries (min, max, average) and the raw rows removed,
      # which is what keeps the database small. Setting it higher keeps more raw readings;
      # it does not shorten how far back the charts go.
      Labby__RetentionDays: ${LABBY_RETENTION_DAYS:-7}
      # Days of hourly summaries to keep, for charts that look back further than that.
      # Never shorter than LABBY_RETENTION_DAYS; 0 keeps nothing beyond the raw readings.
      Labby__HourlyRetentionDays: ${LABBY_HOURLY_RETENTION_DAYS:-365}
    # Containers do not inherit the host's /etc/hosts, NetBIOS or mDNS, so a name your NAS
    # resolves for itself often cannot be resolved in here — and the lookup hangs rather
    # than failing, which presents as a timeout. Either use IP addresses in your
    # connections, or map the names you want here:
    # extra_hosts:
    #   - "fennell-nas:192.168.1.50"

    # If public names fail too — updates report "Could not resolve the host at
    # api.github.com", bookmark icons never load — the container has no working DNS at
    # all. Some NAS firmware hands containers a resolver that answers nothing; name one:
    # dns:
    #   - 192.168.1.1   # your router
    #   - 1.1.1.1

    volumes:
      - labbytwo-data:/app/data

      # Uncomment for the Docker provider, which cannot see the daemon without it.
      # Read-only, and think before you do it: access to this socket is effectively root
      # on the host, so it hands a web app the keys to every container you run. Everything
      # else in LabbyTwo works without it.
      # On a QNAP or Synology the socket may live elsewhere — mount the real path onto
      # /var/run/docker.sock and the provider's default still works.
      # - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  labbytwo-data:
